name: Build and publish Jellyfin repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run regression checks
        run: dotnet run --project verify/Verify.csproj -c Release
      - name: Build against Jellyfin 10.11.11
        run: dotnet publish src/Jellyfin.Plugin.ExtendedFilmography/Jellyfin.Plugin.ExtendedFilmography.csproj -c Release -o artifacts/publish
      - name: Package plugin and catalog
        run: python3 scripts/package_catalog.py
      - name: Keep downloadable build output
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-catalog
          path: _site/
      - name: Prepare Pages deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish catalog and plugin download
        id: deployment
        uses: actions/deploy-pages@v4
