---
name: "Extended Filmography"
guid: "54fa2f7d-5365-456e-8017-75aad96f47d4"
version: "1.0.1.0"

# targetAbi is the MINIMUM server version this build runs on - Jellyfin refuses to load a
# plugin whose targetAbi is higher than the running server. Unlike the NuGet reference in the
# csproj it must be a concrete four-part version: "10.11.*" is not valid here and jprm will
# reject it. Keep it in step with JellyfinVersion and TargetFramework in the csproj.
targetAbi: "10.11.11.0"
framework: "net9.0"

owner: "zillywallfe"
category: "Metadata"

overview: "Show what an actor is known for beyond your library."

description: >
  Extends the person page with an actor's best-known films and series from TMDb, including
  titles that are not in your library. Works in every Jellyfin client, including native apps
  such as Neptune and Swiftfin, because the titles are added to the standard item API response
  rather than drawn by a web-only overlay.

  Nothing is written to the library database and no images are stored, so library scans are
  completely unaffected and uninstalling the plugin removes every trace.

artifacts:
  - "Jellyfin.Plugin.ExtendedFilmography.dll"

changelog: >
  Correct library duplicate filtering and cached selections; broaden defaults; repair installation and ownership.
